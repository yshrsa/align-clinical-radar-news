<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="クリアアライナー領域のPubMedエビデンスを臨床品質と運用判断へつなぐレーダー">
  <title>Align Clinical Operations Radar</title>
  <style>
    :root{--bg:#08111f;--panel:#111d30;--line:#263752;--text:#eef5ff;--muted:#9bb1cf;--accent:#63b3ff;--focal:#42d6a4;--warn:#ffc857}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132b4a 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
    header{position:sticky;top:0;z-index:2;background:#08111fe8;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .nav,.wrap{max-width:1180px;margin:auto;padding:18px 24px}.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;letter-spacing:.02em}.brand span{color:var(--accent)}
    .navlinks{display:flex;align-items:center;gap:8px}.navlinks a{color:var(--muted);border:1px solid transparent;border-radius:999px;padding:7px 11px;font-size:.82rem}.navlinks a:hover,.navlinks a.active{color:var(--text);border-color:var(--line);background:#0d192a}
    h1{font-size:clamp(2rem,5vw,4.3rem);line-height:1.02;margin:52px 0 14px;max-width:900px}.lead{color:var(--muted);font-size:1.08rem;max-width:760px;line-height:1.8}
    .status,.stats{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.pill,.filter{border:1px solid var(--line);background:#0d192a;color:var(--muted);border-radius:999px;padding:9px 14px}
    .stats .pill strong{color:var(--text);margin-right:6px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.filter{cursor:pointer}.filter.active{background:var(--accent);border-color:var(--accent);color:#04101d;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;padding-bottom:60px}.card{background:linear-gradient(145deg,#111f33,#0d1727);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
    .meta,.tags{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}.tag{border:1px solid #344b6d;border-radius:999px;padding:4px 8px}.tag.focal{color:var(--focal);border-color:#276f5b}.tag.high{color:var(--warn);border-color:#78642c}.tag.topic{color:#c9b6ff;border-color:#62518b}
    h2{font-size:1rem;line-height:1.55;margin:0}.summary{color:#c7d5e8;font-size:.9rem;line-height:1.7}.takeaway{padding-left:12px;border-left:3px solid var(--accent);font-size:.88rem;line-height:1.6}.details{font-size:.8rem;color:var(--muted);line-height:1.6}
    a{color:var(--accent);text-decoration:none}.empty{color:var(--muted);padding:30px 0}.footer{border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;padding:24px}
  </style>
</head>
<body>
<header><div class="nav"><div class="brand"><span>Align</span> Clinical Operations Radar</div><nav id="navlinks" class="navlinks" aria-label="Align Clinical Operations Radar"><a class="active" aria-current="page" href="./">Evidence</a><a href="./industry.html">Industry News</a></nav></div></header>
<main class="wrap">
  <h1>Evidence for better<br>clinical operations.</h1>
  <p class="lead">クリアアライナーの公開文献を、計画品質、planned vs achieved、refinement、育成、安全性、デジタル工程の改善へつなぎます。数値や症例数は抄録にない限り補いません。</p>
  <div id="status" class="status"><span class="pill">品質状態を確認中…</span></div>
  <div id="stats" class="stats"></div>
  <div id="filters" class="filters"></div>
  <section id="feed" class="grid"><p class="empty">読み込み中…</p></section>
</main>
<footer class="footer"><div class="wrap">公開データ: PubMed / Clinical Operations向け情報整理プロトタイプ / 臨床判断には使用しません</div></footer>
<script>
let items=[],config={assets:[],topics:[],focal_label:'Align関連'},active='all';
const high=i=>(i.publication_types||[]).some(x=>/Randomized Controlled Trial|Meta-Analysis/i.test(x));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=value=>{try{const u=new URL(value,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};
const assetLabel=id=>(config.assets||[]).find(x=>x.id===id)?.label||id;
const topicLabel=id=>(config.topics||[]).find(x=>x.id===id)?.label||id;
function visible(i){if(active==='all')return true;if(active==='high')return high(i);if(active==='japan')return i.japan_relevant;if(active==='focal')return i.focal_related;if(active.startsWith('topic:'))return(i.matched_topics||[]).includes(active.slice(6));if(active.startsWith('asset:'))return(i.matched_assets||[]).includes(active.slice(6));return true}
function renderFilters(){const defs=[['all','すべて'],['high','RCT・Meta-Analysis'],['japan','日本関連'],['focal',config.focal_label||'Align関連'],...(config.topics||[]).map(x=>[`topic:${x.id}`,x.label]),...(config.assets||[]).map(x=>[`asset:${x.id}`,x.label])];document.querySelector('#filters').innerHTML=defs.map(([k,l])=>`<button class="filter ${k===active?'active':''}" data-filter="${esc(k)}">${esc(l)}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.filter;renderFilters();render()})}
function render(){const rows=items.filter(visible);document.querySelector('#feed').innerHTML=rows.length?rows.map(i=>`<article class="card"><div class="meta"><span>${esc(i.pub_date||'日付不明')}</span><span>${esc(i.journal)}</span><span>PMID ${esc(i.pmid)}</span></div><h2><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a></h2><div class="tags">${high(i)?'<span class="tag high">High evidence</span>':''}${i.focal_related?`<span class="tag focal">${esc(config.focal_label)}</span>`:''}${(i.matched_topics||[]).map(x=>`<span class="tag topic">${esc(topicLabel(x))}</span>`).join('')}${(i.matched_assets||[]).map(x=>`<span class="tag">${esc(assetLabel(x))}</span>`).join('')}</div><div class="summary">${esc(i.summary_ja)}</div><div class="takeaway">${esc(i.key_takeaway_ja)}</div><details class="details"><summary>試験デザイン・エンドポイント</summary><p><b>デザイン:</b> ${esc(i.study_type_ja)}</p><p><b>エンドポイント:</b> ${esc(i.endpoints_ja)}</p><p><b>結果:</b> ${esc(i.endpoint_results_ja)}</p><p><b>症例数:</b> ${esc(i.sample_size_ja)}</p><p><b>Clinical Operations視点:</b> ${esc(i.why_matters_ja)}</p></details></article>`).join(''):'<p class="empty">公開可能な文献はまだありません。収集・要約・品質確認が完了すると表示されます。</p>'}
async function boot(){try{const get=path=>fetch(path,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`${path}: ${r.status}`);return r.json()});const [feed,status,cfg]=await Promise.all([get('./data/news-latest.json'),get('./data/quality-status.json'),get('./data/radar-config.json')]);items=feed.items||[];config=cfg||config;if(config.chat_url){document.querySelector('#navlinks').insertAdjacentHTML('beforeend',`<a href="${esc(safeUrl(config.chat_url))}">AI Chat</a>`)}const fresh=status.freshness||{};document.querySelector('#status').innerHTML=`<span class="pill">品質: <strong>${esc(status.overall_status)}</strong></span><span class="pill">鮮度: <strong>${esc(fresh.status||'unknown')}</strong>${fresh.age_hours==null?'':` / ${esc(fresh.age_hours)}時間`}</span><span class="pill">最終確認: ${esc(status.checked_at_utc||'未実行')}</span>`;document.querySelector('#stats').innerHTML=`<span class="pill"><strong>${status.counts.documents}</strong>文献</span><span class="pill"><strong>${status.counts.summarized}</strong>要約済み</span><span class="pill"><strong>${status.counts.pending}</strong>要約待ち</span><span class="pill"><strong>${items.filter(high).length}</strong>RCT/Meta</span><span class="pill"><strong>${items.filter(x=>x.focal_related).length}</strong>${esc(config.focal_label)}</span>`;renderFilters();render()}catch(e){document.querySelector('#feed').innerHTML=`<p class="empty">読み込みに失敗しました: ${esc(e.message)}</p>`}}
boot();
</script>
</body></html>
