<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="クリアアライナー、デジタル歯科、規制・安全性の公開業界ニュース">
  <title>Industry News — Align Clinical Operations Radar</title>
  <style>
    :root{--bg:#08111f;--panel:#111d30;--line:#263752;--text:#eef5ff;--muted:#9bb1cf;--accent:#63b3ff;--focal:#42d6a4;--warn:#ffc857}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132b4a 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
    header{position:sticky;top:0;z-index:2;background:#08111fe8;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.nav,.wrap{max-width:1180px;margin:auto;padding:18px 24px}.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800}.brand span{color:var(--accent)}
    .navlinks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.navlinks a{color:var(--muted);border:1px solid transparent;border-radius:999px;padding:7px 11px;font-size:.82rem;text-decoration:none}.navlinks a:hover,.navlinks a.active{color:var(--text);border-color:var(--line);background:#0d192a}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:52px 0 14px}.lead{color:var(--muted);max-width:820px;line-height:1.8}.status,.filters{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.pill,.filter{border:1px solid var(--line);background:#0d192a;color:var(--muted);border-radius:999px;padding:8px 13px}.filter{cursor:pointer}.filter.active{background:var(--accent);border-color:var(--accent);color:#04101d;font-weight:700}
    .sources{border:1px solid var(--line);border-radius:16px;background:#0d192a;padding:18px;margin:24px 0}.sources h2{font-size:1rem;margin:0 0 12px}.source-list{display:flex;gap:8px;flex-wrap:wrap}.source-link{font-size:.78rem;border:1px solid #344b6d;border-radius:999px;padding:6px 10px;color:var(--accent);text-decoration:none}.source-link.error{border-color:#8a4b55;color:#ff9caa}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;padding-bottom:60px}.card{background:linear-gradient(145deg,#111f33,#0d1727);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}.meta,.tags,.links{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}.tag{border:1px solid #344b6d;border-radius:999px;padding:4px 8px}.tag.focal{color:var(--focal);border-color:#276f5b}.tag.category{color:var(--warn);border-color:#78642c}h2{font-size:1rem;line-height:1.55;margin:0}.snippet{color:#c7d5e8;font-size:.88rem;line-height:1.7}.label{font-size:.72rem;color:var(--muted);margin-bottom:-7px}a{color:var(--accent);text-decoration:none}.links{margin-top:auto}.empty{color:var(--muted);padding:30px 0}.footer{border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;padding:24px}
  </style>
</head>
<body>
<header><div class="nav"><div class="brand"><span>Align</span> Clinical Operations Radar</div><nav class="navlinks" aria-label="Align Clinical Operations Radar"><a href="./">Evidence</a><a class="active" aria-current="page" href="./industry.html">Industry News</a><a href="https://align-clinical-radar-chat.pages.dev/">AI Chat</a></nav></div></header>
<main class="wrap">
  <h1>Industry News</h1><p class="lead">Align公式、矯正歯科業界、MedTech、FDAの公開情報を収集します。記事本文の転載や推測要約はせず、配信元のタイトル・抜粋と出典URLを表示します。</p>
  <div id="status" class="status"><span class="pill">収集状態を確認中…</span></div>
  <section class="sources"><h2>収集元（媒体URL / RSS・収集URL）</h2><div id="sources" class="source-list"></div></section>
  <div id="filters" class="filters"></div><section id="feed" class="grid"><p class="empty">読み込み中…</p></section>
</main>
<footer class="footer"><div class="wrap">各記事の権利は配信元に帰属します。表示内容は公開フィードのタイトル・抜粋です。</div></footer>
<script>
let items=[],status={},active='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=value=>{try{const u=new URL(value,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};
function renderFilters(){const cats=[...new Set(items.map(x=>x.source_category).filter(Boolean))];const defs=[['all','すべて'],['focal','Align関連'],...cats.map(x=>[x,x])];document.querySelector('#filters').innerHTML=defs.map(([k,l])=>`<button class="filter ${k===active?'active':''}" data-filter="${esc(k)}">${esc(l)}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.filter;renderFilters();render()})}
function render(){const rows=items.filter(x=>active==='all'||(active==='focal'&&x.focal_related)||x.source_category===active);document.querySelector('#feed').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="meta"><span>${esc(x.published_date||'日付不明')}</span><span>${esc(x.source_name)}</span></div><h2><a href="${esc(safe(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a></h2><div class="tags"><span class="tag category">${esc(x.source_category)}</span>${x.focal_related?'<span class="tag focal">Align関連</span>':''}${(x.matched_assets||[]).map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div>${x.snippet_en?`<div class="label">配信元の抜粋（原文）</div><div class="snippet">${esc(x.snippet_en)}</div>`:''}<div class="links"><a href="${esc(safe(x.url))}" target="_blank" rel="noopener noreferrer">原文記事</a><a href="${esc(safe(x.source_url))}" target="_blank" rel="noopener noreferrer">媒体サイト</a><a href="${esc(safe(x.feed_url))}" target="_blank" rel="noopener noreferrer">RSS・収集元</a></div></article>`).join(''):'<p class="empty">この条件に該当するニュースはありません。</p>'}
async function boot(){try{const get=p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()});const [news,st]=await Promise.all([get('./data/industry-news.json'),get('./data/industry-news-status.json')]);items=news.items||[];status=st;document.querySelector('#status').innerHTML=`<span class="pill"><strong>${status.counts.items}</strong>件</span><span class="pill">収集元 <strong>${status.counts.healthy_sources}/${status.counts.sources}</strong>正常</span><span class="pill">最終確認 ${esc(status.checked_at_utc)}</span>`;document.querySelector('#sources').innerHTML=(status.sources||[]).map(s=>`<span><a class="source-link ${s.status==='ok'?'':'error'}" href="${esc(safe(s.source_url))}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a> <a class="source-link" href="${esc(safe(s.feed_url))}" target="_blank" rel="noopener noreferrer">取得元</a></span>`).join('');renderFilters();render()}catch(e){document.querySelector('#feed').innerHTML=`<p class="empty">読み込みに失敗しました: ${esc(e.message)}</p>`}}
boot();
</script>
</body></html>
